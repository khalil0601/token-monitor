name: Build Android Widget APK

on:
  push:
    branches: [main]
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: yes

      - uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android-widget

      - name: Build debug APK
        working-directory: android-widget
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TokenWidget-APK
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
